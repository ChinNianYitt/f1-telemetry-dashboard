name: Auto-Sync Latest F1 Race Parquet Data

on:
  schedule:
    # Runs every Monday at 02:00 UTC
    - cron: '0 2 * * 1'
  workflow_dispatch: # Allows manual one-click trigger on GitHub

jobs:
  update-race-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies & SOCKS Support
        run: |
          python -m pip install --upgrade pip
          # PySocks enables requests/urllib3 to route over SOCKS5 proxies
          pip install fastf1 pandas pyarrow requests "requests[socks]"

      - name: Install and Start Tor Proxy
        run: |
          sudo apt-get update
          sudo apt-get install -y tor
          sudo systemctl start tor
          # Wait 10 seconds for Tor circuit to establish
          sleep 10
          # Verify IP is masked (will print a non-Azure exit IP)
          curl --socks5-hostname 127.0.0.1:9050 https://checkip.amazonaws.com

      - name: Run Exporter Script via Tor Network
        run: |
          torsocks python export_2026_showcase.py

      - name: Commit and Push New Parquet Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add showcase_data/
          if git diff --staged --quiet; then
            echo "No new race data to commit."
          else
            git commit -m "Auto-sync: update showcase Parquet race files [skip ci]"
            git push origin main
          fi