name: Auto-Sync Latest F1 Race Parquet Data

on:
  schedule:
    # Runs every Monday at 02:00 UTC (after standard Sunday race weekends)
    - cron: '0 2 * * 1'
  workflow_dispatch: # Allows you to manually trigger it anytime via a button on GitHub

jobs:
  update-race-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastf1 pandas pyarrow requests

      - name: Run Exporter Script
        run: |
          python export_2026_showcase.py

      - name: Commit and Push New Parquet Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add showcase_data/
          # Only commit if new or updated parquet files were generated
          if git diff --staged --quiet; then
            echo "No new race data to commit."
          else
            git commit -m "Auto-sync: update showcase Parquet race files [skip ci]"
            git push origin main
          fi